name: Update travel data

on:
  schedule:
    # 1st of every month, 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch visa requirements (passport-index-dataset)
        run: node scripts/fetch-visa.js

      - name: Fetch embassies (OpenStreetMap / Overpass)
        run: node scripts/fetch-embassies.js

      - name: Build manifest (with keep-last-good drop guard)
        run: node scripts/build-manifest.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data manifest.json
          if git diff --cached --quiet; then
            echo "No changes this month."
            exit 0
          fi
          git commit -m "data: monthly refresh $(date -u +%Y-%m)"
          git push
